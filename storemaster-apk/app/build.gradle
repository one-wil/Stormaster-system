plugins {
    id 'com.android.application'
}

android {
    namespace 'dz.storemaster.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dz.storemaster.app'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}
